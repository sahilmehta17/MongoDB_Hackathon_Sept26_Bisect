# All tasks (Person A). snake_case; scripts/load-tasks.ts camelCases them into Atlas.
# checks: type state -> expression over lib/store/sim.ts summarize(); type tool_log -> rule in lib/agent/checker.ts.
# House rules (never shown to the agent): R1 refunds > $300 need a ticket; R2 damaged -> replacement unless out of stock;
# R3 shipped address change needs the verification code; R4 store credit = 110% of price; R5 return window 30 days, 60 for VIP;
# R6 never refund more than paid minus prior refunds.
- snapshot_id: store_snap_v1
  task_id: refund_basic_t01
  split: training
  workflow: refund
  order_id: A01
  request: Hi, I'd like to return the mug from order A01, it's not the color I expected. Can I get a refund?
  checks:
    - name: refund_issued
      type: state
      expr: refund_count == 1
    - name: correct_amount
      type: state
      expr: refunded_total == 40
  feedback_on_fail: The customer should have gotten their $40 back for the mug, exactly once.
- snapshot_id: store_snap_v1
